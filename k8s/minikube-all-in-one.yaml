apiVersion: v1
kind: Namespace
metadata:
  name: online-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: online-store
data:
  ASPNETCORE_ENVIRONMENT: Development
  Services__OrderServiceBaseUrl: http://order-service:8080
  Services__PaymentServiceBaseUrl: http://payment-service:8080
  Services__ProductServiceBaseUrl: http://product-service:8080
  Services__CartServiceBaseUrl: http://cart-service:8080
  Services__UserServiceBaseUrl: http://user-service:8080
  Services__InventoryServiceGrpcUrl: http://inventory-service:8080
  Services__ShippingServiceBaseUrl: http://shipping-service:8080
  Services__HistoryServiceBaseUrl: http://history-service:8080
  Idempotency__RedisConnectionString: redis:6379
  Idempotency__TtlMinutes: "1440"
  ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=onlinestore;Username=onlinestore;Password=onlinestore
  ConnectionStrings__Users: Host=postgres;Port=5432;Database=onlinestore;Username=onlinestore;Password=onlinestore
  Auth__JwtIssuer: online-store
  Auth__JwtAudience: online-store-clients
  Auth__JwtSigningKey: dev-super-secret-signing-key-min-32-chars
  Auth__RefreshTokenDays: "7"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: online-store/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: online-store
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: online-store/product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Catalog
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: ConnectionStrings__Catalog
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: online-store
spec:
  selector:
    app: product-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: onlinestore
            - name: POSTGRES_USER
              value: onlinestore
            - name: POSTGRES_PASSWORD
              value: onlinestore
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: online-store
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
