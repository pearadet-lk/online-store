apiVersion: v1
kind: Namespace
metadata:
  name: online-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: online-store
data:
  Observability__OtlpEndpoint: http://jaeger:4317
  Observability__ZipkinEndpoint: http://zipkin:9411/api/v2/spans
  Observability__ElasticsearchUrl: http://elasticsearch:9200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: online-store
data:
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=onlinestore;Username=onlinestore;Password=onlinestore
  ConnectionStrings__Users: Host=postgres;Port=5432;Database=onlinestore;Username=onlinestore;Password=onlinestore
  Auth__JwtIssuer: online-store
  Auth__JwtAudience: online-store-clients
  Auth__JwtSigningKey: dev-super-secret-signing-key-min-32-chars
  Auth__RefreshTokenDays: "7"
  ReverseProxy__Clusters__userCluster__Destinations__d1__Address: http://user-service:8080/
  ReverseProxy__Clusters__productCluster__Destinations__d1__Address: http://product-service:8080/
  ReverseProxy__Clusters__orderCluster__Destinations__d1__Address: http://order-service:8080/
  ReverseProxy__Clusters__paymentCluster__Destinations__d1__Address: http://payment-service:8080/
  ReverseProxy__Clusters__cartCluster__Destinations__d1__Address: http://cart-service:8080/
  ReverseProxy__Clusters__inventoryCluster__Destinations__d1__Address: http://inventory-service:8080/
  ReverseProxy__Clusters__shippingCluster__Destinations__d1__Address: http://shipping-service:8080/
  ReverseProxy__Clusters__historyCluster__Destinations__d1__Address: http://history-service:8080/
  ReverseProxy__Clusters__emailCluster__Destinations__d1__Address: http://email-service:8080/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: online-store/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - configMapRef:
                name: observability-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: online-store
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: online-store/product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: observability-config
          env:
            - name: ConnectionStrings__Catalog
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: ConnectionStrings__Catalog
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: online-store
spec:
  selector:
    app: product-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: onlinestore
            - name: POSTGRES_USER
              value: onlinestore
            - name: POSTGRES_PASSWORD
              value: onlinestore
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: online-store
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
