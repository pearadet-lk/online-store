apiVersion: v1
kind: Namespace
metadata:
  name: online-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: online-store
data:
  ASPNETCORE_ENVIRONMENT: Development
  Services__OrderServiceBaseUrl: http://order-service:8080
  Services__PaymentServiceBaseUrl: http://payment-service:8080
  Services__ProductServiceBaseUrl: http://product-service:8080
  Services__CartServiceBaseUrl: http://cart-service:8080
  Services__UserServiceBaseUrl: http://user-service:8080
  Services__InventoryServiceBaseUrl: http://inventory-service:8080
  Services__ShippingServiceBaseUrl: http://shipping-service:8080
  Services__HistoryServiceBaseUrl: http://history-service:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: online-store/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: online-store
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: online-store/product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: online-store
